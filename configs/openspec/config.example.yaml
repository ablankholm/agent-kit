# OpenSpec workflow configuration example.
# Merge into the resolved root's openspec/config.yaml; see ../README.md.
# Replace the context placeholder with your repository facts before use.

schema: spec-driven

context: |
  <Agents: perform repo discovery and generate the OpenSpec context here>

rules:
  proposal:
    - "Include rollback plan"
    - "Identify affected services"
    - "Identify impacted repo contributors and note likely post merge or pull latest actions"
    - "State explicit non-goals when they prevent scope drift"
    - "Identify repo ownership boundaries when the change spans more than one area"
    - "For non-trivial changes, create an OpenSpec proposal before implementation begins"
    - "For non-trivial OpenSpec work, complete context discovery or explore mode before writing the proposal, tasks, or implementation unless the user explicitly asks to skip it"
    - "If multiple reasonable interpretations of the request exist, surface them and ask before locking the proposal"
    - "Keep proposal scope limited to the user's request; every downstream changed line must trace to that request"
    - "Include an `## Open Questions` checklist for unresolved questions that materially affect design or implementation"
    - "For each Open Question, include a recommended answer, rationale, and the decision it unlocks; resolve questions one by one when the user asks"
    - "Do not advance while load bearing Open Questions remain unchecked unless the user explicitly instructs you to proceed"
    - "When presenting options, include a preferred recommendation with rationale, tuned for best eventual user experience without losing rigour or over building"
    - "When the user names sibling, parent, or related repos, inspect them as prior art, compare objectively against this repo's needs, and state what to copy, adapt, or reject"
    - "Before relying on tool, platform, API, or version support, verify against the installed tool, live system, or current primary documentation, and distinguish generated instructions from actual CLI or schema support"
    - "For copy, migration, or rule porting work, inventory the source set, state exclusions, and include a final faithfulness sweep against the source"
    - "For client data, production systems, secrets, or non-engineer workflows, identify permission boundaries, sandboxing, human gates, and failure modes before recommending agent autonomy or executable access"
    - "State blast radius, graceful degradation, rollback path, and verification evidence in outcome terms, not as a diff replay"
    - "Prefer existing and common services plus narrowly scoped in-repo mechanisms; new infrastructure or vendor lock-in requires an explicit cost, operations, or longevity justification"
    - "For long OpenSpec sweeps, network-bound work, or multi-step artifact work, give brief progress updates with counts, blockers, and the next action"

  specs:
    - "Reference existing patterns before inventing new ones"
    - "Before writing specs for any technology, always fetch the latest official docs. If the project pins an older version, also read the docs for that pinned version and note any relevant differences, including features available in the latest that could benefit the implementation and warrant an upgrade."
    - "Before relying on tool, platform, API, or version support, verify against the installed tool, live system, or current primary documentation, and distinguish generated instructions from actual CLI or schema support"
    - "Use Requirements and Scenarios to describe verifiable behavior"
    - "Write scenarios in testable GIVEN, WHEN, THEN, and AND language"
    - "For user-visible UI changes, specify expected workflows, states, responsive behavior, and visual verification so the target user's actual experience is covered"
    - "Treat OpenSpec specs as the normative behavior contract; docs are companion material unless they explicitly say otherwise"
    - "Delta specs represent intent, not a wholesale replacement; preserve existing main spec content not mentioned by the delta"
    - "Represent behavior removals as explicit OpenSpec changes instead of silent code deletion"
    - "When syncing specs, read both the delta spec and its corresponding main spec before editing"
    - "Apply ADDED, MODIFIED, REMOVED, and RENAMED Requirements intelligently"
    - "Treat adding a scenario as a partial update; do not copy an entire requirement unless the delta says to replace it"
    - "Keep spec sync idempotent so running it twice produces the same main specs"
    - "When reading long lived specs matching `openspec/specs/**/*.md` for spec-driven work, remember the spec paths so commit and PR messages can cite the specs the change was based on"
    - "Do not treat delta specs, directory listings, or search output as long lived spec sources; cite only long lived specs that materially informed the change"

  design:
    - "Document technical decisions, architecture, tradeoffs, and implementation approach"
    - "Keep design detail proportionate to the size and risk of the change"
    - "Reference existing patterns before inventing new ones"
    - "When the user names sibling, parent, or related repos, inspect them as prior art, compare objectively against this repo's needs, and state what to copy, adapt, or reject"
    - "Identify affected services and ownership boundaries"
    - "Include context, goals, non-goals, and decisions when they affect implementation"
    - "Include an `## Open Questions` checklist for unresolved questions that materially affect design or implementation"
    - "For each Open Question, include a recommended answer, rationale, and the decision it unlocks; resolve questions one by one when the user asks"
    - "Do not advance to tasks or implementation while load bearing Open Questions remain unchecked unless the user explicitly instructs you to proceed"
    - "When presenting options, include a preferred recommendation with rationale, tuned for best eventual user experience without losing rigour or over building"
    - "Before relying on tool, platform, API, or version support, verify against the installed tool, live system, or current primary documentation, and distinguish generated instructions from actual CLI or schema support"
    - "Treat single source of truth and drift avoidance as first class design concerns. Prefer one canonical owner for behavior, configuration, checks, docs, commands, skills, and CI; when duplication is unavoidable, document why and how it stays synchronized"
    - "Prefer deterministic code, scripts, hooks, tests, schemas, typed APIs, and purpose-built tools over stochastic agent behavior when they can produce the same outcome. Use LLMs for interpretation, planning, and user interaction around deterministic mechanisms; when both surfaces cover the same behavior, make the stochastic surface defer to the deterministic source of truth"
    - "For material architecture decisions, state the relevant quality attributes and tradeoffs across reliability, security, performance, cost, operability, and sustainability; explain which attribute is being optimized and why"
    - "For production facing changes, design observability with the feature: logs, metrics, traces, alerts, and user impact signals needed to detect failure, degradation, and misuse after release"
    - "For ML changes, document dataset, feature, prompt, model, environment, parameter, evaluation, and deployment lineage so results are reproducible and regressions can be traced"
    - "For AI systems, separate client, intelligence, inference, knowledge, and tool layers; each layer should own its security, identity propagation, caching, failure handling, and policy enforcement"
    - "For AI mediated user outcomes, document transparency, consent, privacy minimization, explainability, fairness risks, user override paths, and any human review gates required by the impact level"
    - "For high risk, production, or ML behavior changes, prefer progressive rollout with feature flags, canaries, shadow mode, blue green deployment, or staged exposure, and define rollback triggers before release"
    - "For client data, production systems, secrets, or non-engineer workflows, identify permission boundaries, sandboxing, human gates, and failure modes before recommending agent autonomy or executable access"
    - "For user-visible UI changes, specify expected workflows, states, responsive behavior, and visual verification; optimize for the target user's actual experience, not just functional completion"
    - "Prefer existing and common services plus narrowly scoped in-repo mechanisms; new infrastructure or vendor lock-in requires an explicit cost, operations, or longevity justification"
    - "If implementation reveals a design issue, update the artifacts or call out the divergence before continuing"
    - "For long OpenSpec sweeps, network-bound work, or multi-step artifact work, give brief progress updates with counts, blockers, and the next action"

  tasks:
    - "Break implementation into checkboxed tasks that are small and in logical order"
    - "Attach a verification step to each multi step task and do not mark the task complete until the check holds"
    - "Update each task checkbox immediately after completing and verifying that task"
    - "Keep code changes minimal and scoped to the task being implemented"
    - "Do not commit, merge, push, deploy, or edit outside the declared scope unless the user explicitly asks for that action"
    - "Match existing file style and conventions in every implementation task"
    - "Do not improve adjacent code, formatting, or style as a side effect"
    - "Flag pre-existing dead code instead of deleting it; removals belong in an OpenSpec change"
    - "Do not introduce workaround changes that hide the failing condition before diagnosing the root cause, unless the user explicitly approves the workaround"
    - "Before relying on tool, platform, API, or version support, verify against the installed tool, live system, or current primary documentation, and distinguish generated instructions from actual CLI or schema support"
    - "Treat single source of truth and drift avoidance as first class design concerns. Prefer one canonical owner for behavior, configuration, checks, docs, commands, skills, and CI; when duplication is unavoidable, document why and how it stays synchronized"
    - "For agent, automation, tool, or workflow changes, include tasks that put deterministic behavior in scripts, hooks, tests, schemas, typed APIs, or purpose-built tools where possible, and verify any LLM-facing surface defers to them"
    - "For copy, migration, or rule porting work, include source inventory, stated exclusions, and a final faithfulness sweep against the source"
    - "For user-visible UI changes, include tasks for expected workflows, states, responsive behavior, and visual verification"
    - "When specs evolve or changes introduce prerequisites, configuration, environment variables, workflows, APIs, or user visible behavior, update the relevant documentation artifacts so they stay in sync; README and `.env.example` are examples, not mandatory targets when they are not relevant."
    - "When changing environment variables, run the repo's env parity check when one exists."
    - "For production facing changes, include tasks to add or update logs, metrics, traces, alerts, and user impact signals needed to detect failure, degradation, and misuse after release"
    - "For ML changes, include tasks to capture dataset, feature, prompt, model, environment, parameter, evaluation, and deployment lineage so results are reproducible and regressions can be traced"
    - "For high risk, production, or ML behavior changes, include rollout, rollback trigger, and monitoring verification tasks covering feature flags, canaries, shadow mode, blue green deployment, or staged exposure as applicable"
    - "When preparing to push, run the canonical local checks covering every file type touched in the commits being pushed"
    - "For spec-driven changes, preserve the set of long lived specs the implementation was based on so the final commit and PR message can cite them"
    - "Run canonical local checks even when a higher-level workflow skill reports checks passed"
    - "Do not write archive after PR merge work into `tasks.md`; archiving belongs on the feature branch before push"
    - "Include OpenSpec validation in the task plan when specs or OpenSpec artifacts change"
    - "For long OpenSpec sweeps, network-bound work, or multi-step implementation, give brief progress updates with counts, blockers, and the next action"

operations:
  apply:
    guidance:
      - "Before implementation, inspect proposal and design artifacts for an `## Open Questions` section with unchecked items. Halt and surface them unless the user explicitly instructs you to proceed."
      - "If `actionContext.mode` is `workspace-planning` and `allowedEditRoots` is empty, treat linked repos and folders as read only context and stop before editing."
      - "Show schema, task progress, remaining task overview, and the dynamic apply instruction before editing."
      - "Keep going through pending tasks in order until all are done, an error occurs, the user interrupts, or a real blocker is reached."
      - "If a task is unclear, pause for clarification. If implementation reveals a design issue, suggest updating the artifacts."
      - "Do not commit, merge, push, deploy, or edit outside the declared scope unless the user explicitly asks for that action."
      - "Do not introduce workaround changes that hide the failing condition before diagnosing the root cause, unless the user explicitly approves the workaround."
      - "For spec-driven changes, keep track of the long lived specs the implementation is based on so the final commit and PR message can cite them."
      - "For long OpenSpec sweeps, network-bound work, or multi-step implementation, give brief progress updates with counts, blockers, and the next action."
      - "On pause or completion, show tasks completed this session and overall progress."
      - "Mark each task complete only after making the required changes and running its verification."

  archive:
    guidance:
      - "Archive implemented OpenSpec changes on the feature branch before pushing the PR."
      - "Before archiving, verify all tasks in `tasks.md` are checked off and `openspec validate <name> --type change` is clean."
      - "Use `openspec archive <change-name>` so the change directory is moved and delta specs merge into main specs correctly."
      - "Do not archive on `main` after merge, and do not delete or move the change directory by hand."
      - "Do not write archive after PR merge work into a change's `tasks.md`; the archive belongs in the PR."
      - "If `actionContext.mode` is `workspace-planning`, stop before syncing specs or moving changes."
      - "Check artifact and task completion before archiving. Warn and confirm before archiving incomplete work."
      - "Do not block archive on warnings after the user confirms; report the warnings in the archive summary."
      - "If delta specs exist, compare them with the corresponding main specs, summarize the pending changes, and sync before archive unless the user explicitly skips sync."
      - "If the user requests sync during archive, use the OpenSpec spec sync behavior: read delta and main specs, merge intelligently, preserve untouched content, and report changed capabilities."
      - "Before archiving, verify completeness, correctness, and coherence against tasks, specs, design, code, and tests."
      - "Verification findings must be classified as CRITICAL, WARNING, or SUGGESTION, with concrete recommendations and file references when applicable."
      - "If only tasks exist, verify task completion only; if tasks and specs exist, verify completeness and correctness; if full artifacts exist, verify completeness, correctness, and coherence."
      - "Archive and PR-facing summaries must state blast radius, graceful degradation, rollback path, and verification evidence in outcome terms, not as a diff replay."
      - "Preserve `.openspec.yaml` when moving a change into archive."
      - "If the archive target already exists for `YYYY-MM-DD-<change-name>`, fail that archive and report the collision."
      - "Review the diff after archiving so implementation, archive movement, and spec merge are all visible on the same branch."
      - "When committing a spec-driven change or raising its PR, the commit message or PR message must clearly list and link the long lived specs the change was based on; this is the mandatory record for interrogating git history for spec hot paths and rot."
      - "Use repo-relative spec paths in commit messages and Markdown links in PR descriptions when possible."
      - "Commit the archive on the feature branch before pushing, using prior repository history for commit message style."
      - "For long archive, sync, verification, or bulk archive work, give brief progress updates with counts, blockers, and the next action."
      - "For bulk archive, run `openspec list --json`, ask the user to choose changes, gather status for each selected change, and show per-change artifact, task, delta spec, conflict, and warning status before confirming."
      - "For bulk archive, detect conflicts when multiple selected changes touch the same capability spec. Resolve by reading their delta specs, checking implementation evidence, applying implemented specs in chronological order when needed, and skipping sync only when implementation is missing."
      - "For bulk archive, use one confirmation for the batch, track success, skip, and failure for each change, and continue past archive target collisions when other selected changes can still archive."
